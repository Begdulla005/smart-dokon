version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smartdokon_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=your_super_secret_key_123

  frontend:
    build: ./frontend
    container_name: smartdokon_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  uploads:
